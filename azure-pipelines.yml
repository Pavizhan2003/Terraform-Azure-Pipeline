trigger:
  branches:
    include:
      - main

pool:
  name: 'Default'

variables:
  backendStorageAccount: 'tfstatepz5655'
  backendResourceGroup: 'rg-terraform-state'
  backendContainer: 'tfstate'
  backendKey: 'dev.terraform.tfstate'
  serviceConnection: 'azure-connection'

stages:
# ------------------------------------------------------------------
# STAGE 1: TERRAFORM VALIDATE & PLAN
# ------------------------------------------------------------------
- stage: TerraformPlan
  displayName: 'Terraform Plan & Validation'
  jobs:
  - job: Plan
    displayName: 'Validate and Generate Plan'
    steps:
    - checkout: self

    - task: AzureCLI@2
      displayName: 'Terraform Init and Plan'
      inputs:
        azureSubscription: '$(serviceConnection)'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        inlineScript: |
          $ErrorActionPreference = 'Stop'$tf = "C:\Tools\Terraform\terraform.exe"

          Write-Host "===> Retrieving Storage Account Key for backend..."
          $ACCOUNT_KEY = (az storage account keys list --resource-group $(backendResourceGroup) --account-name$(backendStorageAccount) --query "[0].value" -o tsv)

          # Configure ARM authentication for Terraform plan/apply
          $env:ARM_USE_OIDC        = "true"
          $env:ARM_OIDC_TOKEN      = $env:idToken$env:ARM_CLIENT_ID       = (az account show --query "user.name" -o tsv)
          $env:ARM_TENANT_ID       = (az account show --query "tenantId" -o tsv)
          $env:ARM_SUBSCRIPTION_ID = (az account show --query "id" -o tsv)

          Write-Host "===> Initializing Terraform Backend..."
          & $tf init `
            -backend-config="resource_group_name=$(backendResourceGroup)" `
            -backend-config="storage_account_name=$(backendStorageAccount)" `
            -backend-config="container_name=$(backendContainer)" `
            -backend-config="key=$(backendKey)" `
            -backend-config="access_key=$ACCOUNT_KEY" `
            -reconfigure

          Write-Host "===> Validating Terraform..."
          & $tf validate

          Write-Host "===> Generating Plan..."
          & $tf plan -out=tfplan

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Execution Plan Artifact'
      inputs:
        targetPath: '$(Build.SourcesDirectory)/tfplan'
        artifact: 'tfplan-drop'

# ------------------------------------------------------------------
# STAGE 2: TERRAFORM APPLY
# ------------------------------------------------------------------
- stage: TerraformApply
  displayName: 'Terraform Apply'
  dependsOn: TerraformPlan
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - job: Apply
    displayName: 'Execute Plan to Azure'
    steps:
    - checkout: self

    - task: DownloadPipelineArtifact@2
      displayName: 'Download Plan Artifact'
      inputs:
        buildType: 'current'
        artifactName: 'tfplan-drop'
        targetPath: '$(Build.SourcesDirectory)'

    - task: AzureCLI@2
      displayName: 'Apply Approved Infrastructure'
      inputs:
        azureSubscription: '$(serviceConnection)'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        inlineScript: |
          $ErrorActionPreference = 'Stop'$tf = "C:\Tools\Terraform\terraform.exe"

          Write-Host "===> Retrieving Storage Account Key for backend..."
          $ACCOUNT_KEY = (az storage account keys list --resource-group $(backendResourceGroup) --account-name$(backendStorageAccount) --query "[0].value" -o tsv)

          $env:ARM_USE_OIDC        = "true"
          $env:ARM_OIDC_TOKEN      = $env:idToken$env:ARM_CLIENT_ID       = (az account show --query "user.name" -o tsv)
          $env:ARM_TENANT_ID       = (az account show --query "tenantId" -o tsv)
          $env:ARM_SUBSCRIPTION_ID = (az account show --query "id" -o tsv)

          Write-Host "===> Re-initializing backend..."
          & $tf init `
            -backend-config="resource_group_name=$(backendResourceGroup)" `
            -backend-config="storage_account_name=$(backendStorageAccount)" `
            -backend-config="container_name=$(backendContainer)" `
            -backend-config="key=$(backendKey)" `
            -backend-config="access_key=$ACCOUNT_KEY" `
            -reconfigure

          Write-Host "===> Applying Infrastructure Plan..."
          & $tf apply -input=false -auto-approve tfplan